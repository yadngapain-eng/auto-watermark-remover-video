
name: Remove Watermark
on:
  workflow_dispatch:
    inputs:
      video_source:
        description: 'Sumber video'
        required: true
        default: 'youtube'
        type: choice
        options: [youtube, drive, direct]
      video_url:
        description: 'URL video'
        required: true
        type: string
      method:
        description: 'Metode'
        required: true
        default: 'repaint'
        type: choice
        options: [repaint, crop]

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download video
        env:
          SOURCE: ${{ inputs.video_source }}
          URL: ${{ inputs.video_url }}
        run: python -c "import os; from scripts.downloader import get_video; get_video(os.environ['SOURCE'], os.environ['URL'])"
        
      - name: Process video
        env:
          METHOD: ${{ inputs.method }}
        run: python scripts/process.py
        
      - name: Encode to standard MP4 (Fix HP compatibility)
        run: |
          ffmpeg -y -i /tmp/output_video.mp4 -c:v libx264 -preset fast -crf 22 -c:a aac /tmp/final.mp4
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-video
          path: /tmp/final.mp4
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          files: /tmp/final.mp4
