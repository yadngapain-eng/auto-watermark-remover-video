
name: Remove Watermark
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL video'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Download video
        env:
          URL: ${{ inputs.video_url }}
        run: python -c "import os; from scripts.downloader import get_video; get_video('youtube', os.environ['URL'])"
        
      - name: Process video
        run: python scripts/process.py
        
      - name: Merge Video with Original Audio (FIX SUARA HILANG)
        run: |
          ffmpeg -y -i /tmp/output_video.mp4 -i /tmp/input_video.mp4 \
                 -c:v libx264 -preset fast -crf 22 -c:a aac -map 0:v:0 -map 1:a:0 \
                 -shortest /tmp/final.mp4
                 
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-video
          path: /tmp/final.mp4
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_number }}
          files: /tmp/final.mp4
